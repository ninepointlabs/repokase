[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "repokase"
version = "0.1.0"
description = "Your repos, chef's choice. A native Omarchy app for managing GitHub repositories."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nine Point Labs" }]
requires-python = ">=3.12"
# PySide6 is intentionally not listed: on Arch it comes from the official
# `pyside6` package, which pip cannot see.
dependencies = ["httpx>=0.27", "qasync>=0.27", "secretstorage>=3.3", "pyyaml>=6"]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio", "respx"]

[project.urls]
Homepage = "https://github.com/ninepointlabs/repokase"
Issues = "https://github.com/ninepointlabs/repokase/issues"

[project.scripts]
repokase = "repokase.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
repokase = ["qml/**/*", "qml/*", "assets/*", "cache/migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
